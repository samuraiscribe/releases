name: Rebuild Website

# samuraiscribe.com/releases is a static page built from this repo's
# releases, so it only changes when the site rebuilds. This pings the
# Cloudflare Pages deploy hook whenever the release list changes:
#   published — release.yml creates a prerelease (shown with a badge)
#   released  — promote-release.yml flips it to latest
#   edited    — notes fixed by hand
#   deleted   — release.yml re-run deletes and recreates a prerelease

on:
  release:
    types: [published, released, edited, deleted]
  workflow_dispatch:

# Promotion fires both `released` and `edited`; one rebuild is enough.
concurrency:
  group: rebuild-website
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::WEBSITE_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL" > /dev/null
          echo "Website rebuild triggered."
